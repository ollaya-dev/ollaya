name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # ort's build script downloads pyke's ONNX Runtime build (CPU) into this directory.
          cache-directories: ~/.cache/ort.pyke.io
      - run: cargo fmt --all --check
      # Default features only: the CPU build. CUDA and CoreML builds run in release.yml.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  windows:
    name: Rust on Windows (clippy, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-directories: ~\AppData\Local\ort.pyke.io
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  mlx:
    name: MLX engine on macOS (clippy, unit tests)
    # The `mlx` feature, off by default: builds MLX and mlx-c from pinned sources with CMake and
    # links them. GitHub's macOS runners have no usable Metal GPU (runner-images#7085), so the GPU
    # tests (crates/ollaya-mlx/tests) and the Metal parity runs happen on a Mac by hand
    # (docs/decisions/0001-mlx-engine.md).
    runs-on: macos-latest
    env:
      # MLX needs macOS 14; the binary says so only when rustc is told (its default is 11.0).
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: mlx
          cache-directories: ~/Library/Caches/ort.pyke.io
      - name: MLX build cache
        run: echo "OLLAYA_MLX_DIR=$HOME/.cache/ollaya-mlx" >>"$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # MLX and mlx-c, built by crates/ollaya-mlx-sys/build.rs (about 4 minutes cold).
          path: ~/.cache/ollaya-mlx
          key: ollaya-mlx-${{ hashFiles('crates/ollaya-mlx-sys/build.rs') }}
      - name: Metal toolchain
        # Xcode 26 ships the Metal compiler as a separate component.
        run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - run: cargo clippy --workspace --all-targets --locked --features ollaya/mlx -- -D warnings
      - run: cargo test --locked -p ollaya-runner -p ollaya-server --lib --features ollaya-runner/mlx
      - name: Binary and Metal library
        run: |
          cargo build --release --locked -p ollaya --features ollaya/mlx
          vtool -show-build target/release/ollaya
          ls -l target/release/ollaya target/release/mlx.metallib

  desktop:
    name: Desktop app (typecheck, clippy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Page (typecheck and build)
        working-directory: desktop
        run: npm ci && npm run ui
      - name: Rust
        working-directory: desktop/src-tauri
        run: |
          # Tauri checks that the bundled engine exists; a placeholder is enough for clippy.
          mkdir -p binaries && touch binaries/ollaya-x86_64-unknown-linux-gnu
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings

  site:
    name: Site build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # The derived registry blobs aren't in git; deploys check them (scripts/fetch-blobs.mjs).
          OLLAYA_ALLOW_MISSING_BLOBS: '1'

  packaging:
    name: Packaging scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        run: shellcheck scripts/install.sh scripts/package.sh scripts/llama-cpp.sh packaging/docker-healthcheck.sh
      - name: install.sh parses under dash
        run: dash -n scripts/install.sh
      - name: install.sh embeds packaging/ollaya.service unchanged
        run: |
          awk '/# BEGIN packaging\/ollaya.service/ { on = 1; next }
               on && /cat <<EOF/ { copy = 1; next }
               copy && /^EOF$/ { exit }
               copy' scripts/install.sh |
            sed 's|[$]BINDIR|/usr/local/bin|' |
            diff -u packaging/ollaya.service -
