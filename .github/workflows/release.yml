name: Release

# A v* tag builds the tarballs, publishes a GitHub Release with them and sha256sum.txt, and pushes
# ghcr.io/<owner>/ollaya:{<version>,latest} (cpu, amd64 + arm64), :{<version>-cuda,cuda} and
# :{<version>-cuda12,cuda12}. Tags with a hyphen (v0.2.0-rc.1) become prereleases and don't move
# latest, cuda or cuda12.
# Running it by hand (workflow_dispatch) builds and packages everything but publishes nothing.
# darwin-arm64 is built with the MLX engine (docs/decisions/0001-mlx-engine.md) for macOS 14 and
# later, and also packages ollaya-darwin-arm64-mlx (its Metal library).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # One binary per x86-64 OS with ORT's CUDA provider bridge; it runs on the CPU unless the
          # libraries of the -cuda (CUDA 13) or -cuda12 archive are installed next to it.
          # linux-arm64 is different: pyke publishes no aarch64 GPU build of ONNX Runtime, so its
          # base binary has no CUDA support at all and only the GPU runner, built below with
          # cuda-dynamic, uses the -cuda archive (docs/decisions/0005-arm64-cuda-pack.md).
          - platform: linux-amd64
            runner: ubuntu-latest
            features: ollaya-runner/cuda
            package-args: --cuda --cuda12
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            features: ''
            package-args: --cuda
          - platform: darwin-arm64
            runner: macos-latest
            features: ollaya-runner/coreml,ollaya-runner/mlx
            package-args: --mlx
          - platform: windows-amd64
            runner: windows-latest
            features: ollaya-runner/cuda
            package-args: --cuda --cuda12
    runs-on: ${{ matrix.runner }}
    env:
      # darwin-arm64 builds the MLX engine.
      MLX: ${{ matrix.platform == 'darwin-arm64' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        id: version
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          [ "$PUBLISH" = true ] || version=0.0.0-dev.${GITHUB_SHA::7}
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Free disk space
        if: matrix.platform == 'linux-amd64'
        # Two GPU packs (about 2.4 and 3.4 GB of libraries, plus their wheels and archives) on top
        # of two Rust builds.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.platform }}
          # pyke's ONNX Runtime download, cached by ort's build script (Linux, macOS paths).
          cache-directories: |
            ~/.cache/ort.pyke.io
            ~/Library/Caches/ort.pyke.io
            ~\AppData\Local\ort.pyke.io
      - name: Install zstd
        if: runner.os == 'macOS'
        run: command -v zstd >/dev/null || brew install zstd
      - name: MLX build cache
        if: env.MLX == 'true'
        run: echo "OLLAYA_MLX_DIR=$HOME/.cache/ollaya-mlx" >>"$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.MLX == 'true'
        with:
          # MLX and mlx-c, built by crates/ollaya-mlx-sys/build.rs (about 4 minutes cold).
          path: ~/.cache/ollaya-mlx
          key: ollaya-mlx-${{ hashFiles('crates/ollaya-mlx-sys/build.rs') }}
      - name: Metal toolchain
        if: env.MLX == 'true'
        # Xcode 26 ships the Metal compiler as a separate component.
        run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - name: Build
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}
          OLLAYA_BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$MLX" = true ]; then
            # MLX needs macOS 14; without this the binary would claim rustc's default, 11.0.
            export MACOSX_DEPLOYMENT_TARGET=14.0
          fi
          cargo build --release --locked -p ollaya ${FEATURES:+--features "$FEATURES"}
      - name: Build the GPU runner
        if: contains(matrix.package-args, '--cuda')
        shell: bash
        env:
          OLLAYA_BUILD_VERSION: ${{ steps.version.outputs.version }}
        # The same program, loading Microsoft's ONNX Runtime from the CUDA pack at run time
        # (docs/decisions/0004-cuda-onnxruntime-builds.md). Its own target directory keeps
        # target/release/ollaya the statically linked build.
        run: |
          cargo build --release --locked -p ollaya --features ollaya-runner/cuda-dynamic \
            --target-dir target/cuda-dynamic
      - name: Smoke test
        run: target/release/ollaya --version
      - name: Minimum macOS version
        if: runner.os == 'macOS'
        run: vtool -show-build target/release/ollaya
      - name: Package
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          PACKAGE_ARGS: ${{ matrix.package-args }}
          FEATURES: ${{ matrix.features }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          export OLLAYA_CARGO_FEATURES=$FEATURES
          case $PLATFORM in
            linux-amd64 | linux-arm64) export OLLAYA_CUDA_RUNNER=target/cuda-dynamic/release/ollaya ;;
            windows-amd64) export OLLAYA_CUDA_RUNNER=target/cuda-dynamic/release/ollaya.exe ;;
          esac
          # shellcheck disable=SC2086 # PACKAGE_ARGS is a list of flags
          scripts/package.sh --platform "$PLATFORM" $PACKAGE_ARGS target/release "$VERSION"
      - name: Smoke test the Windows archives
        if: matrix.platform == 'windows-amd64'
        shell: bash
        env:
          OLLAYA_HOST: 127.0.0.1:11499
        run: |
          # The base archive alone runs with only the DLLs it ships (no GPU pack).
          root=$RUNNER_TEMP/ollaya-smoke
          7z x -bd -bso0 -o"$root" dist/ollaya-windows-amd64.zip
          ls "$root/bin"
          "$root/bin/ollaya.exe" --version
          # With the GPU pack, the server starts GPU runners from a copy of itself inside the pack
          # (docs/distribution.md, "The runtime library contract"). This runner has no GPU.
          7z x -bd -bso0 -o"$root" dist/ollaya-windows-amd64-cuda.zip
          "$root/bin/ollaya.exe" ps
          ls -l "$root"/lib/ollaya/cuda_v13/ollaya-runner-*.exe
          # llama.cpp's CUDA backend for GGUF models, and every DLL it imports that is not the
          # driver's, the system's or ggml-base.dll (loaded from lib/ollaya/llama first).
          test -f "$root/lib/ollaya/cuda_v13/ggml-cuda.dll"
          test -f "$root/lib/ollaya/cuda_v13/cublas64_13.dll"
          "$root/bin/ollaya.exe" stop
          # The CUDA 12 pack on its own, in a second tree.
          root12=$RUNNER_TEMP/ollaya-smoke12
          7z x -bd -bso0 -o"$root12" dist/ollaya-windows-amd64.zip
          7z x -bd -bso0 -o"$root12" dist/ollaya-windows-amd64-cuda12.zip
          "$root12/bin/ollaya.exe" ps
          ls -l "$root12"/lib/ollaya/cuda_v12/ollaya-runner-*.exe
          "$root12/bin/ollaya.exe" stop
      # Dry runs also build the runner's parity and bench tools for Windows, where GPU checks run
      # from an installed layout on machines without a Rust toolchain.
      - name: Parity and bench tools
        if: github.event_name == 'workflow_dispatch' && matrix.platform == 'windows-amd64'
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          cargo build --release --locked -p ollaya-runner --example parity --example parity_llama --example bench ${FEATURES:+--features "$FEATURES"}
          mkdir -p tools
          cp target/release/examples/parity.exe target/release/examples/parity_llama.exe target/release/examples/bench.exe tools/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'workflow_dispatch' && matrix.platform == 'windows-amd64'
        with:
          name: tools-${{ matrix.platform }}
          path: tools/*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Smoke test llama.cpp
        # The packaged ollaya must load its llama.cpp libraries from the install location, pass
        # the build check (version and struct layout) and find the CPU. The CUDA backend needs
        # the NVIDIA driver, which the runners do not have, so only its libraries are checked.
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          d=$(mktemp -d)
          exe=
          case $PLATFORM in
            windows-*) 7z x -bd -bso0 -o"$d" "dist/ollaya-$PLATFORM.zip"; exe=.exe ;;
            *) zstd -dc "dist/ollaya-$PLATFORM.tar.zst" | tar -xf - -C "$d" ;;
          esac
          ls -l "$d/lib/ollaya/llama"
          "$d/bin/ollaya$exe" llama-devices | tee "$d/devices.json"
          grep -q '"type": "cpu"' "$d/devices.json"
          for pack in cuda:cuda_v13 cuda12:cuda_v12; do
            archive=dist/ollaya-$PLATFORM-${pack%%:*}.tar.zst dir=$d/lib/ollaya/${pack#*:}
            [ -f "$archive" ] || continue
            # Without the GPU runner from the base archive, the daemon ignores the pack.
            test -x "$d/lib/ollaya/ollaya-cuda-runner"
            zstd -dc "$archive" | tar -xf - -C "$d"
            (cd "$dir" && sha256sum -c --quiet FILES.sha256)
            # Everything libggml-cuda.so and the ONNX Runtime CUDA provider link is in the pack,
            # except the driver's libcuda.so.1 and libggml-base, which the runner has already
            # loaded from lib/ollaya/llama. GPU runners start with the pack on LD_LIBRARY_PATH
            # (the CUDA 12 build has no $ORIGIN RUNPATH).
            for so in libggml-cuda.so libonnxruntime_providers_cuda.so; do
              missing=$(LD_LIBRARY_PATH="$d/lib/ollaya/llama:$dir" ldd "$dir/$so" |
                grep 'not found' | grep -v 'libcuda\.so\.1' || true)
              [ -z "$missing" ] || { echo "$so: $missing"; exit 1; }
            done
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.platform }}
          path: |
            dist/*.tar.zst
            dist/*.tgz
            dist/*.zip
            dist/*-cuda.sha256
            dist/*-cuda12.sha256
            dist/*-mlx.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          scripts/package.sh --checksums dist
          ls -l dist
          cat dist/sha256sum.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}

  image:
    name: Image ${{ matrix.target }} ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: cpu, arch: amd64, runner: ubuntu-latest }
          - { target: cpu, arch: arm64, runner: ubuntu-24.04-arm }
          - { target: cuda, arch: amd64, runner: ubuntu-latest }
          - { target: cuda12, arch: amd64, runner: ubuntu-latest }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name and version
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"
          version=${GITHUB_REF_NAME#v}
          [ "$PUBLISH" = true ] || version=0.0.0-dev.${GITHUB_SHA::7}
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Free disk space
        if: startsWith(matrix.target, 'cuda')
        # The CUDA images stage 2.4 (cuda) or 3.4 GB (cuda12) of libraries on top of the Rust build.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Each architecture builds natively and is pushed by digest only; the manifest job below
      # tags the multi-arch index once the GitHub Release exists.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          build-args: OLLAYA_BUILD_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
      - name: Record digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.PUBLISH == 'true'
        with:
          name: digests-${{ matrix.target }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Tag images
    needs: [release, image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          path: digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create tags
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          version=${GITHUB_REF_NAME#v}
          # The digest artifacts hold one empty file per image, named after its sha256.
          refs() { local f; for f in "$@"; do echo "$image@sha256:${f##*/}"; done; }
          mapfile -t cpu_refs < <(refs digests/digests-cpu-*/*)
          mapfile -t cuda_refs < <(refs digests/digests-cuda-*/*)
          mapfile -t cuda12_refs < <(refs digests/digests-cuda12-*/*)
          cpu_tags=(-t "$image:$version")
          cuda_tags=(-t "$image:$version-cuda")
          cuda12_tags=(-t "$image:$version-cuda12")
          if [[ $version != *-* ]]; then
            cpu_tags+=(-t "$image:latest")
            cuda_tags+=(-t "$image:cuda")
            cuda12_tags+=(-t "$image:cuda12")
          fi
          docker buildx imagetools create "${cpu_tags[@]}" "${cpu_refs[@]}"
          docker buildx imagetools create "${cuda_tags[@]}" "${cuda_refs[@]}"
          docker buildx imagetools create "${cuda12_tags[@]}" "${cuda12_refs[@]}"
          docker buildx imagetools inspect "$image:$version"
          docker buildx imagetools inspect "$image:$version-cuda"
          docker buildx imagetools inspect "$image:$version-cuda12"
