name: Release

# A v* tag builds the tarballs, publishes a GitHub Release with them and sha256sum.txt, and pushes
# ghcr.io/<owner>/ollaya:{<version>,latest} (cpu, amd64 + arm64) and :{<version>-cuda,cuda}.
# Tags with a hyphen (v0.2.0-rc.1) become prereleases and don't move latest or cuda.
# Running it by hand (workflow_dispatch) builds and packages everything but publishes nothing.
# The MLX engine (docs/decisions/0001-mlx-engine.md) is not in release builds yet: only a manual
# run with `mlx` checked builds darwin-arm64 with it and packages ollaya-darwin-arm64-mlx.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mlx:
        description: 'darwin-arm64: build with the MLX engine and package the MLX archive (not for releases yet)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # One binary per x86-64 OS with ORT's CUDA provider bridge; it runs on the CPU unless the
          # -cuda archive's libraries are installed next to it.
          - platform: linux-amd64
            runner: ubuntu-latest
            features: ollaya-runner/cuda
            package-args: --cuda
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            features: ''
            package-args: ''
          - platform: darwin-arm64
            runner: macos-latest
            features: ollaya-runner/coreml
            package-args: ''
          - platform: windows-amd64
            runner: windows-latest
            features: ollaya-runner/cuda
            package-args: --cuda
    runs-on: ${{ matrix.runner }}
    env:
      # 'true' only for darwin-arm64 in a manual run with the mlx input; tags never set it.
      MLX: ${{ matrix.platform == 'darwin-arm64' && github.event_name == 'workflow_dispatch' && inputs.mlx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        id: version
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          [ "$PUBLISH" = true ] || version=0.0.0-dev.${GITHUB_SHA::7}
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.platform }}
          # pyke's ONNX Runtime download, cached by ort's build script (Linux, macOS paths).
          cache-directories: |
            ~/.cache/ort.pyke.io
            ~/Library/Caches/ort.pyke.io
            ~\AppData\Local\ort.pyke.io
      - name: Install zstd
        if: runner.os == 'macOS'
        run: command -v zstd >/dev/null || brew install zstd
      - name: MLX build cache
        if: env.MLX == 'true'
        run: echo "OLLAYA_MLX_DIR=$HOME/.cache/ollaya-mlx" >>"$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.MLX == 'true'
        with:
          # MLX and mlx-c, built by crates/ollaya-mlx-sys/build.rs (about 4 minutes cold).
          path: ~/.cache/ollaya-mlx
          key: ollaya-mlx-${{ hashFiles('crates/ollaya-mlx-sys/build.rs') }}
      - name: Metal toolchain
        if: env.MLX == 'true'
        # Xcode 26 ships the Metal compiler as a separate component.
        run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - name: Build
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}
          OLLAYA_BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$MLX" = true ]; then
            FEATURES=${FEATURES:+$FEATURES,}ollaya-runner/mlx
            # MLX needs macOS 14; without this the binary would claim rustc's default, 11.0.
            export MACOSX_DEPLOYMENT_TARGET=14.0
          fi
          cargo build --release --locked -p ollaya ${FEATURES:+--features "$FEATURES"}
      - name: Smoke test
        run: target/release/ollaya --version
      - name: Minimum macOS version
        if: runner.os == 'macOS'
        run: vtool -show-build target/release/ollaya
      - name: Package
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          PACKAGE_ARGS: ${{ matrix.package-args }}
          FEATURES: ${{ matrix.features }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$MLX" = true ]; then
            FEATURES=${FEATURES:+$FEATURES,}ollaya-runner/mlx
            PACKAGE_ARGS=${PACKAGE_ARGS:+$PACKAGE_ARGS }--mlx
          fi
          export OLLAYA_CARGO_FEATURES=$FEATURES
          # shellcheck disable=SC2086 # PACKAGE_ARGS is a list of flags
          scripts/package.sh --platform "$PLATFORM" $PACKAGE_ARGS target/release "$VERSION"
      - name: Smoke test the Windows archives
        if: matrix.platform == 'windows-amd64'
        shell: bash
        env:
          OLLAYA_HOST: 127.0.0.1:11499
        run: |
          # The base archive alone runs with only the DLLs it ships (no GPU pack).
          root=$RUNNER_TEMP/ollaya-smoke
          7z x -bd -bso0 -o"$root" dist/ollaya-windows-amd64.zip
          ls "$root/bin"
          "$root/bin/ollaya.exe" --version
          # With the GPU pack, the server starts GPU runners from a copy of itself inside the pack
          # (docs/distribution.md, "The runtime library contract"). This runner has no GPU.
          7z x -bd -bso0 -o"$root" dist/ollaya-windows-amd64-cuda.zip
          "$root/bin/ollaya.exe" ps
          ls -l "$root"/lib/ollaya/cuda_v13/ollaya-runner-*.exe
          "$root/bin/ollaya.exe" stop
      # Dry runs also build the runner's parity and bench tools for Windows, where GPU checks run
      # from an installed layout on machines without a Rust toolchain.
      - name: Parity and bench tools
        if: github.event_name == 'workflow_dispatch' && matrix.platform == 'windows-amd64'
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          cargo build --release --locked -p ollaya-runner --example parity --example bench ${FEATURES:+--features "$FEATURES"}
          mkdir -p tools
          cp target/release/examples/parity.exe target/release/examples/bench.exe tools/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'workflow_dispatch' && matrix.platform == 'windows-amd64'
        with:
          name: tools-${{ matrix.platform }}
          path: tools/*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Smoke test llama.cpp
        # The packaged ollaya must load its llama.cpp libraries from the install location, pass
        # the build check (version and struct layout) and find the CPU. The CUDA backend needs
        # the NVIDIA driver, which the runners do not have, so only its libraries are checked.
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          d=$(mktemp -d)
          exe=
          case $PLATFORM in
            windows-*) 7z x -bd -bso0 -o"$d" "dist/ollaya-$PLATFORM.zip"; exe=.exe ;;
            *) zstd -dc "dist/ollaya-$PLATFORM.tar.zst" | tar -xf - -C "$d" ;;
          esac
          ls -l "$d/lib/ollaya/llama"
          "$d/bin/ollaya$exe" llama-devices | tee "$d/devices.json"
          grep -q '"type": "cpu"' "$d/devices.json"
          if [ -f "dist/ollaya-$PLATFORM-cuda.tar.zst" ]; then
            zstd -dc "dist/ollaya-$PLATFORM-cuda.tar.zst" | tar -xf - -C "$d"
            (cd "$d/lib/ollaya/cuda_v13" && sha256sum -c --quiet FILES.sha256)
            # Everything libggml-cuda.so links is in the pack, except the driver's libcuda.so.1 and
            # libggml-base, which the runner has already loaded from lib/ollaya/llama.
            missing=$(LD_LIBRARY_PATH="$d/lib/ollaya/llama" ldd "$d/lib/ollaya/cuda_v13/libggml-cuda.so" |
              grep 'not found' | grep -v 'libcuda\.so\.1' || true)
            [ -z "$missing" ] || { echo "$missing"; exit 1; }
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.platform }}
          path: |
            dist/*.tar.zst
            dist/*.tgz
            dist/*.zip
            dist/*-cuda.sha256
            dist/*-mlx.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          scripts/package.sh --checksums dist
          ls -l dist
          cat dist/sha256sum.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}

  image:
    name: Image ${{ matrix.target }} ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: cpu, arch: amd64, runner: ubuntu-latest }
          - { target: cpu, arch: arm64, runner: ubuntu-24.04-arm }
          - { target: cuda, arch: amd64, runner: ubuntu-latest }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name and version
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"
          version=${GITHUB_REF_NAME#v}
          [ "$PUBLISH" = true ] || version=0.0.0-dev.${GITHUB_SHA::7}
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Free disk space
        if: matrix.target == 'cuda'
        # The CUDA image stages about 2 GB of libraries on top of the Rust build.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Each architecture builds natively and is pushed by digest only; the manifest job below
      # tags the multi-arch index once the GitHub Release exists.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          build-args: OLLAYA_BUILD_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
      - name: Record digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.PUBLISH == 'true'
        with:
          name: digests-${{ matrix.target }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Tag images
    needs: [release, image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          path: digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create tags
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          version=${GITHUB_REF_NAME#v}
          # The digest artifacts hold one empty file per image, named after its sha256.
          refs() { local f; for f in "$@"; do echo "$image@sha256:${f##*/}"; done; }
          mapfile -t cpu_refs < <(refs digests/digests-cpu-*/*)
          mapfile -t cuda_refs < <(refs digests/digests-cuda-*/*)
          cpu_tags=(-t "$image:$version")
          cuda_tags=(-t "$image:$version-cuda")
          if [[ $version != *-* ]]; then
            cpu_tags+=(-t "$image:latest")
            cuda_tags+=(-t "$image:cuda")
          fi
          docker buildx imagetools create "${cpu_tags[@]}" "${cpu_refs[@]}"
          docker buildx imagetools create "${cuda_tags[@]}" "${cuda_refs[@]}"
          docker buildx imagetools inspect "$image:$version"
          docker buildx imagetools inspect "$image:$version-cuda"
