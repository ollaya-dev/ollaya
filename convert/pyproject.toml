[project]
name = "ollaya-convert"
version = "0.0.0"
description = "Build-time conversion of decision models to the Ollaya (ONNX) model format"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    # The reference the goldens were made with. 0.3.7 is no longer listed on PyPI (the
    # author removed it), so it is pinned by its file URL; the file is still served.
    "laya @ https://files.pythonhosted.org/packages/b5/fd/dd60f49451ef43af50c3fcd5d5d9b12aea590f5bcb9afb3e5ec5171b6fa6/laya-0.3.7.tar.gz",
    "torch==2.14.*",
    "transformers==5.17.*",
    "tokenizers==0.23.*",
    "onnx==1.23.*",
    "onnxscript==0.7.*",
    "onnxruntime==1.30.*",
    "numpy>=2",
    "pyarrow>=20",
]

[tool.uv]
package = false

# CUDA 13 wheels on Linux and Windows. PyTorch publishes no CUDA build for macOS, so there
# torch comes from PyPI (Apple silicon wheels, CPU and MPS); exports and parity run on the CPU.
[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
