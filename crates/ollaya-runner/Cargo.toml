[package]
name = "ollaya-runner"
description = "Inference engines behind Ollaya's runner processes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# pyke publishes one CUDA build per platform: CUDA 13 + TensorRT + NV TensorRT RTX providers on
# Linux, the same plus DirectML on Windows. Asking for these features selects it. Only the CUDA
# provider is registered at runtime.
cuda = ["ort/cuda", "ort/tensorrt", "ort/nvrtx"]
# Links pyke's macOS build (which includes the Core ML provider). Models run on the CPU provider
# until the Core ML path is measured against CPU and verified for parity.
coreml = ["ort/coreml"]

[dependencies]
axum.workspace = true
ollaya-decision.workspace = true
tokio.workspace = true
tracing.workspace = true
ndarray.workspace = true
ort = { workspace = true, features = ["download-binaries", "copy-dylibs", "tls-rustls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokenizers.workspace = true

[dev-dependencies]
anyhow.workspace = true
