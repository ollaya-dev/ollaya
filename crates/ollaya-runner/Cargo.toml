[package]
name = "ollaya-runner"
description = "Inference engines behind Ollaya's runner processes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# pyke publishes one Linux CUDA build, with CUDA 13 + TensorRT + NV TensorRT RTX providers; asking
# for exactly that feature set selects it. Only the CUDA provider is registered at runtime.
cuda = ["ort/cuda", "ort/tensorrt", "ort/nvrtx"]

[dependencies]
ollaya-decision.workspace = true
ndarray.workspace = true
ort = { workspace = true, features = ["download-binaries", "copy-dylibs", "tls-rustls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokenizers.workspace = true

[dev-dependencies]
anyhow.workspace = true
