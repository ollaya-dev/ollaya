[package]
name = "ollaya-desktop"
description = "Ollaya's desktop app: start and stop the server, download models, run decisions"
version = "0.6.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ollaya-dev/ollaya"
publish = false

# Its own workspace, so the engine's builds and CI never pull in the webview stack.
[workspace]

[lib]
name = "ollaya_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
futures-util = "0.3.34"
ollaya-api = { path = "../../crates/ollaya-api" }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tauri = { version = "2.11.6", features = [] }
tokio = { version = "1.53.1", features = ["time", "process", "sync", "macros"] }

# macOS: Ollaya lives in the menu bar. objc2 dresses the native menu (header switch, subtitles,
# section headers); the same versions tray-icon and muda already use.
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.11.6", features = ["tray-icon", "image-png"] }
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSFontDescriptor",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSSwitch",
    "NSText",
    "NSTextField",
    "NSView",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
